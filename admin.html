<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#315b4f">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin · Streitschlichter</title>
  <link rel="stylesheet" href="style.css?v=3">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js" defer></script>
  <script src="firebase.js?v=3" defer></script>
  <script src="admin.js?v=7" defer></script>
</head>
<body class="admin-page">
  <a class="skip-link" href="#main">Zum Inhalt springen</a>
  <header class="admin-header">
    <div>
      <p class="eyebrow">Raum 008</p>
      <h1>Terminverwaltung</h1>
      <p>Geschützter Bereich der Streitschlichtung</p>
    </div>
    <div class="header-actions"><a class="btn secondary compact" href="owner.html">Eigentümer</a><button id="logout-button" class="btn secondary compact hidden" type="button">Abmelden</button></div>
  </header>

  <main id="main" class="admin-app">
    <section id="login-panel" class="card login-card" aria-labelledby="login-title">
      <p class="section-label">Admin-Zugang</p>
      <h2 id="login-title">Anmelden</h2>
      <form id="login-form">
        <div class="field">
          <label for="email">E-Mail-Adresse</label>
          <input id="email" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Passwort</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button id="login-button" class="btn primary" type="submit">Anmelden</button>
      </form>
      <button id="google-login-button" class="btn secondary" type="button">Mit Google anmelden</button>
      <p id="auth-status" class="form-status" role="status" aria-live="polite"></p>
    </section>

    <section id="calendar-panel" class="hidden" aria-labelledby="calendar-title">
      <div class="card notification-settings">
        <div>
          <p class="section-label">E-Mail-Benachrichtigung</p>
          <h2>Empfänger ändern</h2>
          <p>An diese Adresse wird bei jeder neuen Buchung eine Nachricht gesendet.</p>
        </div>
        <form id="notification-form" class="notification-form">
          <label for="notification-email">Admin-E-Mail-Adresse</label>
          <div class="inline-field">
            <input id="notification-email" type="email" required value="timurschule4@gmail.com">
            <button class="btn primary compact" type="submit">Speichern</button>
          </div>
          <p id="notification-status" class="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
      <div class="calendar-heading">
        <div>
          <p class="section-label">Übersicht</p>
          <h2 id="calendar-title">Gebuchte Termine</h2>
        </div>
        <p id="appointment-count" class="count-badge">0 Termine</p>
      </div>
      <div class="card calendar-card">
        <div id="calendar" aria-label="Terminkalender"></div>
      </div>
      <p id="calendar-status" class="form-status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <div id="day-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <div class="modal-header">
        <div>
          <p class="section-label">Termine am</p>
          <h2 id="modal-title"></h2>
        </div>
        <button id="close-modal-button" class="icon-button" type="button" aria-label="Fenster schließen">×</button>
      </div>
      <div id="modal-list" class="appointment-list"></div>
    </div>
  </div>
</body>
</html>
